name: Build Plugin and Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # 只改 CI / 测试 / 文档时不触发 22 个版本的构建
    paths-ignore:
      - '.github/workflows/**'
      - 'tests/**'
      - 'skills/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_beta:
        description: '是否发布 Beta 版本'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_loader:
        description: '只构建指定加载器'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'fabric'
          - 'folia'
          - 'forge'
          - 'neoforge'
          - 'spigot'  
          - 'paper'
          - 'velocity'
          - 'vanilla'
          - 'gtnh'
          - 'cleanroom'
      target_version:
        description: '只构建指定版本，例如 1.12.2 或 all'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  generate-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate Matrix
        id: set-matrix
        run: |
          chmod 777 matrix.sh
          ./matrix.sh -path "vanilla","spigot","velocity","forge","neoforge","fabric","folia","paper","gtnh","cleanroom" -loader "${{ github.event.inputs.target_loader || 'all' }}" -version "${{ github.event.inputs.target_version || 'all' }}"

  build:
    runs-on: ubuntu-26.04
    needs: generate-matrix
    strategy:
      # 发布矩阵必须跑完：默认 fail-fast 会在第一个目标失败时取消其余 job，
      # 结果就是「只看到一个错误、其余无结果」，排查和补发都没法做。
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Chose JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}-${{ hashFiles(format('{0}/{0}-{1}/build.gradle*', matrix.config.mc-loader, matrix.config.mc-version), format('{0}/{0}-{1}/settings.gradle*', matrix.config.mc-loader, matrix.config.mc-version)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}-
            ${{ runner.os }}-gradle-${{ matrix.config.mc-loader }}-

      - name: Read version.txt and save to variable
        run: |
          mod_version=$(cat version.txt)
          echo "Version: $mod_version"
          echo "MOD_VERSION=$mod_version" >> $GITHUB_ENV

      - name: Init Files
        run: chmod 777 init.sh && ./init.sh

      - name: Init Gradle
        run: |
          cd ${{ matrix.config.mc-loader }}/${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}
          chmod 777 gradlew && ./gradlew --version

      - name: Test
        run: |
          cd ${{ matrix.config.mc-loader }}/${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}
          ./gradlew test

      - name: Build
        run: |
          cd ${{ matrix.config.mc-loader }}/${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}
          ./gradlew clean build

      - name: Set Version Type
        id: set-version-type
        run: |
          # tag 即正式发布；分支 push 与手动触发一律 beta
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_TYPE=release" >> $GITHUB_ENV
          else
            echo "VERSION_TYPE=beta" >> $GITHUB_ENV
          fi

      - name: Resolve Publish Loader
        id: resolve-loader
        run: |
          case "${{ matrix.config.mc-loader }}" in
            gtnh|cleanroom)
              echo "PUBLISH_LOADER=forge" >> $GITHUB_ENV
              ;;
            *)
              echo "PUBLISH_LOADER=${{ matrix.config.mc-loader }}" >> $GITHUB_ENV
              ;;
          esac

      # 发布按项目类型分两条路：
      #   mod 类（fabric/forge/neoforge/cleanroom/gtnh）→ Modrinth + CurseForge
      #   插件类（paper/spigot/velocity/folia）      → 仅 Modrinth
      #
      # 插件类暂不发 CurseForge：CF 要求每个文件带「Environment」组版本（Client/Server），
      # 而 mc-publish v3.3 只在「Mods」那套 id 里拼接 environment，
      # 「Bukkit Plugins」那套（pluginGameVersionIds）完全不含 —— 传了 environment 也会被丢掉，
      # 结果是稳定的 400 errorCode=1021。见 curseforge-upload-api-client.ts 的 idVariants。
      # 插件类需要人工到 CF 上传，或用 itsmeow/curseforge-upload 另起一步（见 README）。
      - name: Publish to Modrinth + CurseForge (mod)
        uses: Kir-Antipov/mc-publish@v3.3
        if: |
          (
            (startsWith(github.ref, 'refs/tags/v') && matrix.config.mc-loader != 'vanilla') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_beta == 'true' && matrix.config.mc-loader != 'vanilla')
          ) && !contains(fromJSON('["paper","spigot","velocity","folia"]'), matrix.config.mc-loader)
        with:
          modrinth-id: rVJvtYoX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1084495
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: QueQiao-${{ matrix.config.mc-loader }}+${{ matrix.config.mc-version }}-${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}+${{ env.PUBLISH_LOADER }}-${{ matrix.config.mc-version }}
          version-type: ${{ env.VERSION_TYPE }}
          loaders: ${{ env.PUBLISH_LOADER }}
          # CurseForge 要求每个文件至少包含一个「Environment」组版本（Client/Server），
          # 缺了会 400 errorCode=1021。QueQiao 跑在服务端，显式声明 server。
          environment: server
          game-versions: ${{ matrix.config.publish-version }}
          files: QueQiao-jar/${{ env.MOD_VERSION }}/QueQiao-${{ env.PUBLISH_LOADER }}+${{ matrix.config.mc-version }}-${{ env.MOD_VERSION }}.jar

      - name: Publish to Modrinth (plugin)
        uses: Kir-Antipov/mc-publish@v3.3
        if: |
          (
            (startsWith(github.ref, 'refs/tags/v') && matrix.config.mc-loader != 'vanilla') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_beta == 'true' && matrix.config.mc-loader != 'vanilla')
          ) && contains(fromJSON('["paper","spigot","velocity","folia"]'), matrix.config.mc-loader)
        with:
          modrinth-id: rVJvtYoX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: QueQiao-${{ matrix.config.mc-loader }}+${{ matrix.config.mc-version }}-${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}+${{ env.PUBLISH_LOADER }}-${{ matrix.config.mc-version }}
          version-type: ${{ env.VERSION_TYPE }}
          loaders: ${{ env.PUBLISH_LOADER }}
          environment: server
          game-versions: ${{ matrix.config.publish-version }}
          files: QueQiao-jar/${{ env.MOD_VERSION }}/QueQiao-${{ env.PUBLISH_LOADER }}+${{ matrix.config.mc-version }}-${{ env.MOD_VERSION }}.jar

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.config.mc-loader == 'vanilla'
        run: |
          TAG="v${MOD_VERSION}"
          JAR="QueQiao-jar/${MOD_VERSION}/QueQiao-${{ matrix.config.mc-loader }}+${{ matrix.config.mc-version }}-${MOD_VERSION}.jar"
          # Create Release 与本工作流并行，release 可能尚未建立，这里做一次兜底
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag --title "$TAG"
          gh release upload "$TAG" "$JAR" --clobber

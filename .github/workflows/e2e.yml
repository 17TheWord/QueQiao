name: E2E

# 端到端验证：真起服务端 + 假玩家 + WebSocket 全量 API 与事件。
#
# 触发策略：
#   PR / push        → 只跑最新一个版本，快速反馈（约 6 分钟）
#   手动 + full=true → 跑全部 fabric 版本
#   每周定时         → 跑全部 fabric 版本，及时发现回归
#
# 已实测：fabric-1.16.5 与 1.21.11 在 JDK 21 下均可正常起服并全项通过，
# 因此矩阵统一用 JDK 21，不按 java_version 拆 JDK。

on:
  workflow_dispatch:
    inputs:
      target_loader:
        description: '只测指定加载器（velocity / spigot / vanilla 目前没有 runServer，会失败）'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'fabric'
          - 'folia'
          - 'forge'
          - 'neoforge'
          - 'spigot'
          - 'paper'
          - 'velocity'
          - 'vanilla'
          - 'gtnh'
          - 'cleanroom'
      target_version:
        description: '只测指定版本，例如 1.21.11；留空或 all 表示全部'
        required: false
        default: 'all'
        type: string
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
      - '*/origin/src/main/**'
  # 不挂 push 触发：main 上不一定有 tests/ 目录，
  # 且代码变更已由 pull_request 覆盖
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix
        id: m
        run: |
          LOADER="${{ inputs.target_loader }}"
          VERSION="${{ inputs.target_version }}"
          [ -z "$LOADER" ] && LOADER="fabric"
          [ -z "$VERSION" ] && VERSION="all"

          ITEMS=""
          add_dir() {
            # $1=加载器  $2=版本过滤（all 或具体版本）
            for d in "$1"/*-*; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              ver="${name#"$1"-}"
              if [ "$2" = "all" ] || [ "$ver" = "$2" ]; then
                # 跳过已知无法在 dev 环境起 runServer 的目标（显式指定加载器时仍可跑，用于排查）
                if [ -n "${EXCLUDED:-}" ] && [[ " $EXCLUDED " == *" $1/$name "* ]]; then
                  echo "跳过已知问题目标: $1/$name" >&2
                  continue
                fi
                ITEMS="$ITEMS{\"target\":\"$1/$name\"},"
              fi
            done
          }

          case "${{ github.event_name }}" in
            pull_request)
              # PR 只跑冒烟：fabric 最新一个。
              # 不要用 */ 结尾的 glob，末尾斜杠会干扰 sort -V
              LATEST=$(ls -d fabric/*-* | grep -v origin | sort -V | tail -1)
              ITEMS="{\"target\":\"$LATEST\"}"
              ;;
            schedule)
              add_dir fabric all
              ;;
            *)
              # 目前只有这些加载器的 runServer 能直接跑起来。
              # paper/folia 的 paperweight、spigot 的 BuildTools、vanilla 的自定义程序、
              # velocity 的代理端，run 任务形态都不同，需单独适配后才会纳入自动矩阵。
              SUPPORTED="fabric forge cleanroom"
              # forge 1.21 的 dev 环境起不来：Forge 51.x 换了 mod 发现机制（Bootstrap + JPMS），
              # 分离的 build/resources 与 build/classes 会被判成「有 mods.toml 但找不到类」。
              # 1.16.5 ~ 1.20.1 均正常，仅 1.21 受影响。
              EXCLUDED="forge/forge-1.21"
              if [ "$LOADER" = "all" ]; then
                for L in $SUPPORTED; do
                  [ -d "$L" ] && add_dir "$L" "$VERSION"
                done
              else
                # 显式指定则照跑，便于逐个验证适配进度
                add_dir "$LOADER" "$VERSION"
              fi
              ;;
          esac

          ITEMS="${ITEMS%,}"
          if [ -z "$ITEMS" ]; then
            echo "没有匹配到版本目录（loader=$LOADER, version=$VERSION）" >&2
            exit 1
          fi
          echo "matrix=[$ITEMS]" >> $GITHUB_OUTPUT
          echo "共 $(echo "$ITEMS" | grep -o 'target' | wc -l) 个目标：[$ITEMS]"

  e2e:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Chose JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: e2e-${{ matrix.target }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            e2e-${{ matrix.target }}-
            ${{ runner.os }}-gradle-
            e2e-

      - name: Install test deps
        working-directory: tests/e2e
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm i --no-audit --no-fund; fi

      # 版本目录（fabric/fabric-1.16.5 等）是 init.sh 从 origin 模板生成的，不提交到仓库。
      # 缺少这一步的话 checkout 出来的树里没有 gradle-wrapper.jar 与 gradlew，
      # 会报 "Could not find or load main class org.gradle.wrapper.GradleWrapperMain"。
      - name: Init version dirs
        run: chmod +x init.sh && ./init.sh

      # forge/neoforge 等用的是自己的 Gradle 版本（如 8.12），首次会下载发行包并 fork daemon。
      # 这一步把它们挪到 run.sh 之外，避免和「等 WebSocket 就绪」的超时窗口抢时间。
      - name: Warm up Gradle wrapper
        run: |
          cd "${{ matrix.target }}"
          chmod +x gradlew
          ./gradlew --version

      - name: Run E2E
        run: |
          chmod +x tests/e2e/run.sh
          bash tests/e2e/run.sh "${{ matrix.target }}"

      - name: Dump server log on failure
        if: failure()
        run: |
          LOG="${{ matrix.target }}/run/server-e2e.log"
          echo "===== 日志路径: $LOG ====="
          if [ -f "$LOG" ]; then
            echo "----- 最后 60 行 -----"
            tail -60 "$LOG"
            echo "----- 异常行 -----"
            grep -nE "ERROR|Exception|Caused by|FAILURE" "$LOG" | tail -25 || true
          else
            echo "未生成服务端日志，检查 gradlew runServer 是否成功启动"
            ls -la "${{ matrix.target }}/run/" 2>/dev/null || true
          fi

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ strategy.job-index }}
          path: ${{ matrix.target }}/run/server-e2e.log
          if-no-files-found: ignore
          retention-days: 7

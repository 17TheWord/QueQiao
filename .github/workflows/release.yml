name: Create Release

# 发布流程：打 v* tag 时创建 Release。
#
# 与旧版的关键区别：
#   1. 只由 tag 触发，不再由 push main 触发
#   2. 移除了 --cleanup-tag —— 那会删掉刚推上来的 tag，
#      导致 build 工作流的上传步骤失去目标，也无法重放
#   3. 改为「不存在才创建」，与 Build 工作流里的兜底逻辑兼容

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Read version.txt
        id: ver
        run: |
          MOD_VERSION=$(tr -d '\r\n' < version.txt)
          echo "version.txt: $MOD_VERSION"
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: Verify tag matches version.txt
        run: |
          EXPECTED="v${MOD_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "✗ tag 名 ${GITHUB_REF_NAME} 与 version.txt（${MOD_VERSION}）不一致，应打 ${EXPECTED}"
            exit 1
          fi
          echo "✓ tag 与 version.txt 一致：${EXPECTED}"

      - name: Create Release if absent
        run: |
          TAG="v${MOD_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建（可能已由 Build 工作流兜底创建）"
          else
            gh release create "$TAG" --generate-notes --verify-tag --title "$TAG"
            echo "Release $TAG 已创建"
          fi
